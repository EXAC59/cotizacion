services:
  postgres:
    image: postgres:16-alpine
    container_name: cotizacion_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cotizacion}
      POSTGRES_USER: ${DB_USERNAME:-cotizacion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cotizacion} -d ${DB_DATABASE:-cotizacion}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cotizacion

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cotizacion_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_NAME: ${APP_NAME:-Cotizacion}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-cotizacion}
      DB_USERNAME: ${DB_USERNAME:-cotizacion}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/lectura-docling}
      N8N_COMPARATOR_WEBHOOK_URL: ${N8N_COMPARATOR_WEBHOOK_URL:-http://n8n:5678/webhook/comparador-precios}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_TIMEOUT: ${N8N_TIMEOUT:-30}
      DOCLING_BASE_URL: http://docling-serve:5001
      DOCLING_TIMEOUT: ${DOCLING_TIMEOUT:-180}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      # CT Internacional — catálogo FTP + API (ver docs/deploy/ct-internacional.md)
      # Autocomplete/UI por SKU (numParte); lookup interno resuelve SKU → clave CT.
      # WHOLESALER_CT_PREFER_SKU=true (default): ofertas y autofill exponen SKU, no clave.
      WHOLESALER_DEMO_OFFERS: ${WHOLESALER_DEMO_OFFERS:-false}
      WHOLESALER_COMPARE_CODES: ${WHOLESALER_COMPARE_CODES:-CT,CVA}
      WHOLESALER_CT_BASE_URL: ${WHOLESALER_CT_BASE_URL:-http://connect.ctonline.mx:3001}
      WHOLESALER_CT_API_KEY: ${WHOLESALER_CT_API_KEY:-}
      WHOLESALER_CT_EMAIL: ${WHOLESALER_CT_EMAIL:-}
      WHOLESALER_CT_CLIENTE: ${WHOLESALER_CT_CLIENTE:-}
      WHOLESALER_CT_RFC: ${WHOLESALER_CT_RFC:-}
      WHOLESALER_CT_LOOKUP_PATH: ${WHOLESALER_CT_LOOKUP_PATH:-/existencia/promociones/{part_number}}
      WHOLESALER_CT_SOURCE_IP: ${WHOLESALER_CT_SOURCE_IP:-}
      WHOLESALER_CT_TIMEOUT: ${WHOLESALER_CT_TIMEOUT:-20}
      WHOLESALER_CT_AUTH_HEADER: ${WHOLESALER_CT_AUTH_HEADER:-}
      WHOLESALER_CT_FTP_HOST: ${WHOLESALER_CT_FTP_HOST:-}
      WHOLESALER_CT_FTP_USER: ${WHOLESALER_CT_FTP_USER:-}
      WHOLESALER_CT_FTP_PASSWORD: ${WHOLESALER_CT_FTP_PASSWORD:-}
      WHOLESALER_CT_FTP_PATH: ${WHOLESALER_CT_FTP_PATH:-/catalogo_xml/productos.json}
      WHOLESALER_CT_CATALOG_TTL: ${WHOLESALER_CT_CATALOG_TTL:-15}
      WHOLESALER_CT_PREFER_SKU: ${WHOLESALER_CT_PREFER_SKU:-true}
      WHOLESALER_CT_PART_ALIASES: ${WHOLESALER_CT_PART_ALIASES:-}
      # Grupo CVA — API v2 (login user/password → Bearer)
      WHOLESALER_CVA_BASE_URL: ${WHOLESALER_CVA_BASE_URL:-https://apicvaservices.grupocva.com/api/v2}
      WHOLESALER_CVA_USER: ${WHOLESALER_CVA_USER:-}
      WHOLESALER_CVA_PASSWORD: ${WHOLESALER_CVA_PASSWORD:-}
      WHOLESALER_CVA_TIMEOUT: ${WHOLESALER_CVA_TIMEOUT:-20}
      WHOLESALER_CVA_SYNC_TIMEOUT: ${WHOLESALER_CVA_SYNC_TIMEOUT:-90}
      WHOLESALER_CVA_FX: ${WHOLESALER_CVA_FX:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cotizacion

  nginx:
    image: nginx:alpine
    container_name: cotizacion_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - cotizacion

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: cotizacion_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
      VITE_API_PROXY_TARGET: http://nginx:80
    depends_on:
      - nginx
    networks:
      - cotizacion

  n8n:
    image: n8nio/n8n:latest
    container_name: cotizacion_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE:-http://localhost:5678}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      # Detrás de nginx/Hostinger (X-Forwarded-For / trust proxy)
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      # Secreto compartido con Laravel (header X-N8N-Webhook-Secret en workflows)
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${DB_USERNAME:-cotizacion}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      docling-serve:
        condition: service_started
    networks:
      - cotizacion

  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    container_name: cotizacion_docling
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
    volumes:
      - docling_cache:/root/.cache
    networks:
      - cotizacion

networks:
  cotizacion:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  docling_cache:
  vendor_data:
  frontend_node_modules:
