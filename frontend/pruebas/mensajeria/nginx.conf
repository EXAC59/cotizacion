server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Environment "mensajeria-pruebas" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;

    location = /mensajeria {
        return 308 /mensajeria/;
    }
    location /mensajeria/ {
        index index.html;
        try_files $uri $uri/ =404;
    }
    location / {
        return 404;
    }
}
