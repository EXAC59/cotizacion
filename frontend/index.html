<!doctype html>
<html lang="es">
  <head>
    <base href="%BASE_URL%" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <title>Cotización B2B</title>
    <script>
      ;(function () {
        var moduleScript = document.querySelector('script[type="module"]')
        if (!moduleScript) return
        var loadedSrc = moduleScript.getAttribute('src') || ''
        function checkForDeploy() {
          fetch('/spa/index.html', { cache: 'no-store' })
            .then(function (res) {
              return res.text()
            })
            .then(function (html) {
              var match = html.match(/assets\/index-[^"']+\.js/)
              if (!match) return
              if (loadedSrc.indexOf(match[0]) === -1) window.location.reload()
            })
            .catch(function () {})
        }
        checkForDeploy()
        window.setInterval(checkForDeploy, 30000)
      })()
    </script>
    <script src="%BASE_URL%reload-poller.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
